<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Budget Control</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      (function () {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repoBase = segments.length > 0 ? '/' + segments[0] + '/' : '/Budgetapp/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.replace(repoBase + 'index.html' + search + hash);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #5e6d67;">
      Loading Budget Control...
    </p>
  </body>
</html>
